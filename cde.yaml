# cde.yaml — jax-gpt DSv3 training iteration

project: jax-gpt-dsv3

image:
  registry: gcr.io/tpu-vm-gke-testing
  name: jax-gpt-dsv3
  dockerfile: ./docker/Dockerfile.dsv3.tpu
  context: .

template: ./manifests/jobset.yaml.j2

team: dev

defaults:
  value-class: development
  declared-duration-minutes: 240
  tpu-type: tpu7x-256
  num-slices: 1

# Override cde's team→namespace derivation. autoperf 2026-05-11 update:
# bodaborg-super-rbq cluster was reset ~19 days ago; old poc-dev namespace
# + poc-dev-priority were dropped. New layout: all jobsets run in `default`
# namespace with standard cluster-wide priority classes (high/medium/low);
# localqueue `lq` is in default namespace.
defaults_overrides:
  namespace: default
  priority_class: medium

  # v304-auxar reproduction defaults (override per-run with --set).
  config: full
  moe_backend: gmm_ag
  attn_backend: splash
  optimizer: sgd
  fsdp: 128
  ep: 4
  tp: 1
  gbs: 4096
  dtype: bfloat16
  steps: 5
  grad_clip: 1.0
  # Boolean store_true flags — must be explicit now that the template
  # treats unspecified as False (was implicitly True for these two
  # via the previous overrides.get(..., True) defaults).
  gradient_checkpoint: true
  no_cp: true

profile:
  base-uri: gs://max-experiments/dsv3/profiles

history: {}
