# Full DS-v3 671B training on v7x 4x8x8 (256 chips, 512 devices).
# This is the target topology from our roofline analysis.
# FSDP=512, EP=1, SGD, GBS=1.
#
# kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-512 apply -f k8s/dsv3-full-4x8x8.yaml
# kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-512 logs -l app=dsv3-4x8x8-v1 --prefix=true -f --max-log-requests=256 2>&1 | tee -a /tmp/dsv3-4x8x8-v1.log
# kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-512 delete jobset dsv3-4x8x8-v1

---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v1
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 3
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v1
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v7
                  imagePullPolicy: Always
                  args:
                    - "--config=full"
                    - "--moe_backend=ragged_dot"
                    - "--optimizer=sgd"
                    - "--fsdp=512"
                    - "--ep=1"
                    - "--gbs=1"
                    - "--steps=10"
                    - "--gradient_checkpoint"
                    - "--profile"
                    - "--profile_dir=gs://max-experiments/sivaibhav-dsv3/profiles/full-4x8x8-v1"
                    - "--profile_skip=3"
                    - "--profile_steps=2"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://max-experiments/sivaibhav-dsv3/jax-cc/dsv3-full-4x8x8-v1"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
