# Full DSv3 training — Pallas forward (fused_ep_moe_v1), EP=32 FSDP=16 DP=1.
#
# EP=32, FSDP=16, DP=1: 32×16×1=512 devices ✓.
# F_shard = D_moe/FSDP = 2048/16 = 128 — satisfies Pallas A2A kernel alignment.
# dp=1 avoids the INT32 scan-carry overflow that hits dp>1.
#
# Fixes vs v107:
#   - Remove extra_mesh_axes=("dp",) from Pallas kernel call in forward_kernel.py.
#     lax.axis_index("dp") is not accessible inside pallas_call within shard_map(ep,fsdp).
#     For dp=1, (ep, fsdp) 2-tuple device IDs are equivalent to (0, ep, fsdp) 3-tuple.
#     This was causing a silent Mosaic/XLA compiler crash (exit code 1, ~20 min into compile).
#
#   - Forward:  Pallas A2A kernel, FSDP-sharded weights (bf=bfc=F_shard=128)
#   - Backward: streaming_bwd_v2 (same as jax backend)
#   - Routing:  scoring_fn="identity", biased_scores passed from moe_routing
#
# Compare loss against v103-full-jax (same EP=32, FSDP=16, GBS=1024, loss ~86.64).
#
# Config: full (D=7168, L=61, E=256), EP=32, FSDP=16, GBS=1024, 5 steps
# Devices: 4x8x8 = 64 pods × 8 devices = 512 JAX devices
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     apply -f k8s/dsv3-train-4x8x8-v108-full-pallas-fwd.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=dsv3-4x8x8-v108-full-pallas-fwd --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v108-full-pallas-fwd.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset dsv3-4x8x8-v108-full-pallas-fwd
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v108-full-pallas-fwd
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: lq
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: dsv3-4x8x8-v108-full-pallas-fwd
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x8x8"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v108-train
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=full
              - --moe_backend=fused_ep_moe_v1
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=16
              - --ep=32
              - --gbs=1024
              - --steps=5
              - --gradient_checkpoint
              - --grad_clip=1.0
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x8x8-ep32-fsdp16-gbs1024-v108-full-pallas-fwd
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
