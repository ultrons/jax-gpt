# DS-v3 671B eval on a SINGLE TPU host (4 chips, 8 devices).
# PVC is ReadWriteOnce — can only mount on one node.
# FSDP=8 to shard 1.3 TB across 8 devices (167 GB/device, fits in 190 GB/chip).
#
# kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot apply -f k8s/dsv3-eval-single.yaml
# kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot logs dsv3-eval-single -f
# kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot delete pod dsv3-eval-single

apiVersion: v1
kind: Pod
metadata:
  name: dsv3-eval-single
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-tpu-accelerator: tpu7x
    cloud.google.com/gke-tpu-topology: 2x4x4
  volumes:
    - name: model-weights
      persistentVolumeClaim:
        claimName: ds-v3-weights-pvc
  containers:
    - name: eval
      image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v7-eval
      imagePullPolicy: Always
      command: ["python", "eval_logits.py"]
      args:
        - "--model_dir=/mnt/model/DeepSeek-V3"
        - "--fsdp=8"
        - "--ep=1"
        - "--n_layers=8"
      volumeMounts:
        - name: model-weights
          mountPath: /mnt/model
          readOnly: true
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
      resources:
        limits:
          google.com/tpu: "4"
