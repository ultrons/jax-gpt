# DS-v3 671B on sivaibhav-exp-v7x 4x8x8. EP=32, FSDP=16, ragged_dot, bf16, GBS=4.
# Roofline prediction: ~3292 TPS/chip (targeting 4k TPS/chip).
# Profile: gs://sivaibhav-exp/dsv3/profiles/4x8x8-ep32-ragged-pdbs4-v4
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v4.yaml
#
# Logs:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs -l app=dsv3-4x8x8-v4 --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v4.log
#
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v4
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v4
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v4
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v26-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=jax"
                    - "--optimizer=sgd"
                    - "--fsdp=16"
                    - "--ep=32"
                    - "--gbs=4"
                    - "--steps=15"
                    - "--gradient_checkpoint"
                    - "--profile"
                    - "--profile_dir=gs://sivaibhav-exp/dsv3/profiles/4x8x8-ep32-ragged-pdbs4-v4"
                    - "--profile_skip=5"
                    - "--profile_steps=2"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep32-ragged-pdbs4-v4"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
