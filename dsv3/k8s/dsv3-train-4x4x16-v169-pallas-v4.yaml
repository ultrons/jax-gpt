# DSv3 671B mini — Pallas v4 MoE, fix: (bt,E) bool relayout in compute_gating.
#
# v168 failed: MosaicError: Invalid relayout: Non-singleton logical dimension
#   is replicated in destination but not in source for 'vector<16x128xi1>':
#   "16,{0,*},(8,128)" -> "16,{*,*},(16,128)"
# Root cause: two places produce (bt=16, E=128) i1 in compute_gating:
#   1. jnp.where(row_iota_e == i, ...) — row_iota_e==i is (bt,E) bool
#   2. jnp.where(hit_mask > 0, -jnp.inf, input) — hit_mask>0 is (bt,E) bool
#   Mosaic lays out (16,128) i1 with tile (8,128) using sublanes for the
#   extra 8 rows.  Downstream ops need tile (16,128) with dim-0 replicated
#   — an illegal relayout for a non-singleton dimension.
# Fix:
#   1. Replace jnp.where(row_iota_e == i, ...) with pure int32 arithmetic:
#        row_eq_i = 1 - jnp.minimum(jnp.abs(row_iota_e - i), 1)  # (bt,E) int32
#        hit_mask = hit_mask + row_eq_i * expert_hit[None, :]
#   2. Replace jnp.where(hit_mask > 0, -jnp.inf, input) with float arithmetic:
#        _large_neg = jnp.array(jnp.finfo(input.dtype).min, dtype=input.dtype)
#        input = input + hit_mask.astype(input.dtype) * _large_neg
#      0.0 * finite_large_neg = 0.0 (no nan), so already-masked -inf entries
#      stay at -inf; hit positions shift to ≈ -inf via finfo.min.
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     apply -f k8s/dsv3-train-4x4x16-v169-pallas-v4.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=v169-pallas-v4 --prefix=true -f --max-log-requests=64 -n poc-dev \
#     2>&1 | tee -a /tmp/v169-pallas-v4.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset v169-pallas-v4 -n poc-dev
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v169-pallas-v4
  namespace: poc-dev
  labels:
    kueue.x-k8s.io/queue-name: lq
    team: dev
    value-class: development
    declared-duration-minutes: "60"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: v169-pallas-v4
              declared-duration-minutes: "60"
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x4x16"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            priorityClassName: poc-dev-priority
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v169-pallas-v4
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=mini
              - --moe_backend=fused_ep_moe_v4
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=16
              - --ep=16
              - --tp=2
              - --gbs=256
              - --steps=3
              - --gradient_checkpoint
              - --grad_clip=1.0
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_TRACEBACK_FILTERING
                value: "off"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x4x16-ep16-fsdp16-tp2-v169-pallas-v4
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
