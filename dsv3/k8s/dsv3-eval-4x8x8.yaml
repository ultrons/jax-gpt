# Full DS-v3 671B eval on 4x8x8 (256 chips) with parallel weight loading.
# EP=64 for reads: each of 64 hosts reads only 4 experts. Then reshard to EP=1.
#
# kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-512 apply -f k8s/dsv3-eval-4x8x8.yaml
# kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-512 logs -l app=dsv3-eval-4x8x8 --prefix=true -f --max-log-requests=64 2>&1 | tee -a /tmp/dsv3-eval-4x8x8.log
# kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-512 delete jobset dsv3-eval-4x8x8

---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-eval-4x8x8
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-eval-4x8x8
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              volumes:
                - name: model-weights
                  persistentVolumeClaim:
                    claimName: ds-v3-weights-pvc
              containers:
                - name: eval
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v11-eval
                  imagePullPolicy: Always
                  command: ["python", "eval_logits.py"]
                  args:
                    - "--model_dir=/mnt/model/DeepSeek-V3"
                    - "--fsdp=8"
                    - "--ep=64"
                  volumeMounts:
                    - name: model-weights
                      mountPath: /mnt/model
                      readOnly: true
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: TRANSFORMERS_OFFLINE
                      value: "1"
                  resources:
                    limits:
                      google.com/tpu: "4"
