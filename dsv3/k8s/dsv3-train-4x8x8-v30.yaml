# DS-v3 671B: jax backend, EP=8, FSDP=64, GBS=1024, v48-train.
#
# Fix over v29: replace jnp.where mask with multiply-mask on all_sel_x.
#   - v29 added batched gather (Phase 2): all_sel_x = flat_x[all_safe_tids]
#   - v29 used jnp.where(all_valid[:, None], all_sel_x, 0) to zero-mask padding
#     → XLA materializes a 1.88 GB zeros tensor → add_select_fusion (1.50s/step regression)
#   - Fix: all_sel_x = all_sel_x * all_valid.astype(dtype)[:, None]
#     → element-wise multiply, fuses with downstream matmuls → ~free
#     → gradient: d[invalid] = g[invalid]*0 = 0 → no spurious d_flat_x[0] update
#
# v28 baseline: 13.32s/step, 1230 TPS/chip.
# v29 regression: 14.42s/step (+1.10s from add_select_fusion 1.50s + gather 0.61s - scatter 0.74s savings)
# Expected v30: ~13.0s/step (v29 - 1.50s mask + ~0.1s multiply = ~12.92-13.1s)
#   - Keeps v29's scatter savings (2.41s → 1.67s = -0.74s)
#   - Keeps extra gather_offload overhead (+0.61s vs v28)
#   - Eliminates add_select_fusion: -1.50s
#   - Replaces with ~free multiply: ~+0.1s
#   - Expected: ~13.02s/step, ~1254 TPS/chip
#
# Memory: same as v29 (~93.76 GB compile-time, under 94.75 GB limit).
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v30.yaml
#
# Logs:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs -l app=dsv3-4x8x8-v30 --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v30.log
#
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v30
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v30
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v30
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v48-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=jax"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=64"
                    - "--ep=8"
                    - "--gbs=1024"
                    - "--steps=15"
                    - "--gradient_checkpoint"
                    - "--profile"
                    - "--profile_dir=gs://sivaibhav-exp/dsv3/profiles/4x8x8-ep8-fsdp64-gbs1024-v30"
                    - "--profile_skip=5"
                    - "--profile_steps=2"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep8-fsdp64-gbs1024-v30"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
