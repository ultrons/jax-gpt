# DS-v3 671B correctness check: load pretrained weights, verify logits.
# Uses PVC with HF weights (ReadWriteOnce — single pod only).
# Runs on 2x4x4 TPU slice with weights mounted.
#
# Deploy:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot apply -f k8s/dsv3-eval-v1.yaml
# Monitor:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot logs -l app=dsv3-eval-v1 --prefix=true -f --max-log-requests=16 2>&1 | tee -a /tmp/dsv3-eval-v1.log
# Cleanup:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot delete jobset dsv3-eval-v1

---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-eval-v1
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 8
          parallelism: 8
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-eval-v1
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x4x4
              volumes:
                - name: model-weights
                  persistentVolumeClaim:
                    claimName: ds-v3-weights-pvc
              containers:
                - name: eval
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v10-eval
                  imagePullPolicy: Always
                  command: ["python", "eval_logits.py"]
                  args:
                    - "--model_dir=/mnt/model/DeepSeek-V3"
                    - "--fsdp=64"
                    - "--ep=1"
                    # full 61 layers — 21 GB/device with FSDP=64, fits in 95 GB/core
                  volumeMounts:
                    - name: model-weights
                      mountPath: /mnt/model
                      readOnly: true
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: TRANSFORMERS_OFFLINE
                      value: "1"
                  resources:
                    limits:
                      google.com/tpu: "4"
