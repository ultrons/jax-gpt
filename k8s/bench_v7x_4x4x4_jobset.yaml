# Qwen3.5-397B decode benchmark on 4×4×4 v7x (ehorning-ironwood)
#
# Topology:  4×4×4 v7x = 64 chips = 16 hosts × 4 chips (tpu7x-standard-4t)
# Sharding:  TP=8, DP=16 (64 chips / 8 TP = 8 DP ... wait, 64/8=8 DP)
#            Actually: 128 devices (2 TC/chip), TP=8, DP=16
#
# No Kueue on this cluster — no queue labels needed.
#
# Deploy:
#   kubectl apply -f k8s/bench_v7x_4x4x4_jobset.yaml
#
# Monitor:
#   kubectl logs -l app=qwen35-bench-4x4x4 --prefix=true -f --max-log-requests=16
#
# Cleanup:
#   kubectl delete jobset qwen35-bench-4x4x4

---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: qwen35-bench-4x4x4
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 2
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 16
          parallelism: 16
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: qwen35-bench-4x4x4
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x4x4
              containers:
                - name: bench
                  image: gcr.io/tpu-vm-gke-testing/jax-gpt-tpu:v66
                  imagePullPolicy: Always
                  command: ["python", "scripts/qwen35_benchmark.py"]
                  args:
                    - "--config=full"
                    - "--dtype=fp8"
                    - "--sharding=B"
                    - "--batch-size=256"
                    - "--prompt-len=1024"
                    - "--decode-steps=32"
                    - "--dp=16"
                    - "--n-runs=3"
                    - "--use-rpa"
                    - "--skip-prefill"
                    - "--scan-mode=unrolled"
                    - "--profile"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: PROFILE_DIR
                      value: "gs://sivaibhav-exp/qwen-profiles/v66-4x4x4-bs256"
                    - name: LIBTPU_INIT_ARGS
                      value: "--xla_tpu_offload_gather_to_sparsecore=true --xla_tpu_enable_offloading_scatter_to_sparsecore=true --xla_tpu_enable_offloading_sort_to_sparsecore=true"
                  resources:
                    limits:
                      google.com/tpu: "4"
