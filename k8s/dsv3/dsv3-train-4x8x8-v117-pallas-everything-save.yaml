# Pallas fwd + gradient_checkpoint + everything_saveable policy.
#
# Hypothesis test: save_only_these_names (v115/v116) caused forward NaN because
# GSPMD inserts a wrong collective to materialize the custom_vjp_call_jaxpr output
# (opaque sharding) as a checkpoint residual.
#
# everything_saveable: saves ALL intermediates, creates NO jaxpr_staged.
# - No residual save op for Pallas output in forward HLO → no wrong collective → forward correct
# - No jaxpr_staged → Pallas A2A never re-executed in backward → no backward NaN
# Tradeoff: higher HBM (activations kept live), but acceptable for diagnosis.
#
# Expected outcome: initial_loss ≈ 25.06x AND all 5 steps complete without NaN.
# If OOM instead: confirms thesis (need split-checkpoint approach as v118).
#
# Config: debug (D=7168, L=13, L_dense=3 → 10 MoE layers, E=256, K=8, D_moe=2048)
# Mesh: EP=32, FSDP=16, DP=1 — 512 devices
# GBS=1024, S=4096, steps=5
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     apply -f k8s/dsv3-train-4x8x8-v117-pallas-everything-save.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=dsv3-4x8x8-v117-pallas-everything-save --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v117-pallas-everything-save.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset dsv3-4x8x8-v117-pallas-everything-save
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v117-pallas-everything-save
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: lq
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: dsv3-4x8x8-v117-pallas-everything-save
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x8x8"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v117-train
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=debug
              - --moe_backend=fused_ep_moe_v1
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=16
              - --ep=32
              - --gbs=1024
              - --steps=5
              - --gradient_checkpoint
              - --grad_clip=1.0
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x8x8-ep32-fsdp16-gbs1024-v117-pallas-everything-save
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
