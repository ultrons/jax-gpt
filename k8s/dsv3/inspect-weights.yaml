apiVersion: v1
kind: Pod
metadata:
  name: dsv3-inspect
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: cpu-np
  volumes:
    - name: model-weights
      persistentVolumeClaim:
        claimName: ds-v3-weights-pvc
  containers:
    - name: inspect
      image: python:3.11-slim
      command: ["bash", "-c", "apt-get update -qq && apt-get install -y -qq tree > /dev/null 2>&1; echo '=== Disk contents ==='; ls -la /mnt/model/; echo; echo '=== DeepSeek-V3 dir ==='; ls -la /mnt/model/DeepSeek-V3/ 2>/dev/null | head -30; echo; echo '=== Config ==='; cat /mnt/model/DeepSeek-V3/config.json 2>/dev/null | head -80; echo; echo '=== Weight files ==='; ls -lhS /mnt/model/DeepSeek-V3/*.safetensors 2>/dev/null | head -20; echo; echo '=== Total size ==='; du -sh /mnt/model/DeepSeek-V3/ 2>/dev/null; sleep 300"]
      volumeMounts:
        - name: model-weights
          mountPath: /mnt/model
