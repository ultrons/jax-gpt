# DSv3 671B mini — Pallas forward + JAX backward, EP=32 TP=1.
#
# Key changes from v219:
#   v220: fix sync_barrier() — lax.fori_loop signal loop → static Python for loop.
#
#   v219 crashed silently at runtime (Exit Code 1, no Python traceback) ~51s
#   after "[DBG] train_step returned (compilation done, awaiting exec)".
#   Root cause: sync_barrier() used lax.fori_loop(0, num_devices, _signal_one, None)
#   for the semaphore_signal loop.  pltpu.semaphore_signal is an ICI op; inside a
#   lax.fori_loop (compiled to while_loop by Mosaic) the signals are unreliable —
#   some devices skip signals → pltpu.semaphore_wait(barrier_sem, num_devices) on
#   peer devices never unblocks → 60-second XLA collective timeout → os._exit(1).
#   sync_barrier() is called from inside lax.fori_loop bodies (run_per_bt and
#   run_per_expert), so the nesting makes the problem inevitable.
#   Fix: convert sync_barrier() signal loop to static Python for loop, matching
#   the inference kernel (kernel.py) exactly.  Static loops unroll at trace time
#   → sequential HLO semaphore_signal instructions → all signals fire correctly.
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     -n poc-dev apply -f k8s/dsv3-train-4x4x16-v220-pfwd-jbwd.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=v220-pfwd-jbwd --prefix=true -f --max-log-requests=64 -n poc-dev \
#     2>&1 | tee -a /tmp/v220-pfwd-jbwd.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset v220-pfwd-jbwd -n poc-dev
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v220-pfwd-jbwd
  namespace: poc-dev
  labels:
    kueue.x-k8s.io/queue-name: lq
    team: dev
    value-class: development
    declared-duration-minutes: "30"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: v220-pfwd-jbwd
              declared-duration-minutes: "30"
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x4x16"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            priorityClassName: poc-dev-priority
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v220-pfwd-jbwd
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=mini
              - --moe_backend=pfwd_jbwd
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=16
              - --ep=32
              - --tp=1
              - --gbs=256
              - --steps=3
              - --grad_clip=1.0
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_TRACEBACK_FILTERING
                value: "off"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x4x16-ep32-fsdp16-tp1-v220-pfwd-jbwd
              - name: TF_CPP_MIN_LOG_LEVEL
                value: "0"
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
