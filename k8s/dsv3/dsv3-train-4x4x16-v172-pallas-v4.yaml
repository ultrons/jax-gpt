# DSv3 671B mini — Pallas v4 MoE, fix: bins sizing E_local→E_global bug.
#
# Root cause of v170 OOM + v171 slow compilation:
#
# backward_kernel_v4.py line 375 used E_local in the avg_tpe denominator:
#   avg_tpe = max(cdiv(TK * 3, E_local * 2), 128)   # WRONG: E_local
#
# At EP=16 (E_local=16, E_global=256, TK=524288):
#   WRONG:   avg_tpe = 49152  → TK_padded=786432  → bins=(786432,7168) f32 = 22.6 GB each
#   CORRECT: avg_tpe = 4096   → TK_padded=65536   → bins=(65536,7168) f32 = 1.88 GB each
#
# The correct formula uses E_global because at EP>1, each local expert only
# handles E_local/E_global of all token-expert pairs. The bins should be sized
# by the global average tokens per expert (TK/E_global), not TK/E_local which
# is 16× too large.
#
# Fix: avg_tpe = max(cdiv(TK, E_global) * 2, 128)   # E_global, 2× safety
#
# Also reverts the 1.5× band-aid from v171 back to 2× (correct with E_global).
#
# Expected compile time: <10 min (bins now ~3.76 GB vs ~45 GB)
# Expected HBM at compile: ~50 GB (well under 94.75 GB limit)
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     apply -f k8s/dsv3-train-4x4x16-v172-pallas-v4.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=v172-pallas-v4 --prefix=true -f --max-log-requests=64 -n poc-dev \
#     2>&1 | tee -a /tmp/v172-pallas-v4.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset v172-pallas-v4 -n poc-dev
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v172-pallas-v4
  namespace: poc-dev
  labels:
    kueue.x-k8s.io/queue-name: lq
    team: dev
    value-class: development
    declared-duration-minutes: "30"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: v172-pallas-v4
              declared-duration-minutes: "30"
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x4x16"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            priorityClassName: poc-dev-priority
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v172-pallas-v4
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=mini
              - --moe_backend=fused_ep_moe_v4
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=16
              - --ep=16
              - --tp=2
              - --gbs=256
              - --steps=3
              - --gradient_checkpoint
              - --grad_clip=1.0
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_TRACEBACK_FILTERING
                value: "off"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x4x16-ep16-fsdp16-tp2-v172-pallas-v4
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
