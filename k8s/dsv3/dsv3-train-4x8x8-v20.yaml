# DS-v3 671B: jax backend, EP=32, FSDP=16, GBS=1024, v39-train.
#
# Purpose: fix v17/v18/v19 INT32 overflow + HBM OOM via two-part fix:
#
# Fix Part A — EP-sharded activations:
#   batch_ax = ("ep","fsdp") for jax backend EP>1.
#   Each device holds T/(EP*FSDP) = 1024/512 = 2 sequences instead of 64.
#   Scan carry per chunk: (29, 2, 4096, 7168) = 1.7B elements < INT32_MAX ✓
#   HBM: carry = 6.8 GB (was 54 GB) + weights 2.62 GB + activations ≈ 25 GB total ✓
#
# Fix Part B — Chunked scan (29+29 layers):
#   Even with B_local=2: 58×2×4096×7168 = 3.4B > INT32_MAX.
#   Two 29-layer chunks: 29×2×4096×7168 = 1.7B < INT32_MAX ✓
#
# Inside shard_map: _expert_mlp_ep_body_ep_sharded all_gathers x from EP axis
# to reconstruct FSDP-shard token set (262144 tokens) for expert compute, then
# psum_scatter returns EP-sharded output. Same compute as before, ~7 MB extra ICI per layer.
#
# Expected: no INT32 overflow, no HBM OOM. Step time ~2-3× v2 (EP=32 GBS=1 was 2.64s).
# Expected TPS/chip: GBS×S / step_time / 256. At 6-8s: ~2000-2700 TPS/chip.
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v20.yaml
#
# Logs:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs -l app=dsv3-4x8x8-v20 --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v20.log
#
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v20
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v20
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v20
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v39-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=jax"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=16"
                    - "--ep=32"
                    - "--gbs=1024"
                    - "--steps=15"
                    - "--gradient_checkpoint"
                    - "--profile"
                    - "--profile_dir=gs://sivaibhav-exp/dsv3/profiles/4x8x8-ep32-fsdp16-gbs1024-v20"
                    - "--profile_skip=5"
                    - "--profile_steps=2"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep32-fsdp16-gbs1024-v20"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
