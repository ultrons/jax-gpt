# DSv3 671B — FSDP=512 EP=1 TP=1, GBS=4096, S=4096.
#
# Key insight: FSDP=512 TP=1 gives B_l=8 (same as v251 at GBS=2048/FSDP=256).
# Scan carry [58,8,4096,7168] = 25.4 GB — fits without host offload.
# No TP → F_local=D_moe=2048 (full), excellent MXU, no AllReduce.
# AllGather D in MoE: [256,7168,2048] = 3.75 GB temporary per weight.
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     -n poc-dev apply -f k8s/dsv3-train-4x8x8-v257-rd.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=v257-rd --prefix=true -f --max-log-requests=64 -n poc-dev \
#     2>&1 | tee -a /tmp/v257-rd.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset v257-rd -n poc-dev
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v257-rd
  namespace: poc-dev
  labels:
    kueue.x-k8s.io/queue-name: lq
    team: dev
    value-class: development
    declared-duration-minutes: "240"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: v257-rd
              declared-duration-minutes: "240"
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x8x8"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            priorityClassName: poc-dev-priority
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v257-rd
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=full
              - --moe_backend=gmm
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=512
              - --ep=1
              - --tp=1
              - --gbs=4096
              - --dtype=bfloat16
              - --steps=5
              - --grad_clip=1.0
              - --gradient_checkpoint
              - --profile
              - --profile_dir=gs://max-experiments/dsv3/profiles/v257-rd-fsdp512-gbs4096/
              - --profile_skip=2
              - --profile_steps=1
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_TRACEBACK_FILTERING
                value: "off"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x8x8-fsdp512-ep1-tp1-gbs4096-v257-rd
              - name: TF_CPP_MIN_LOG_LEVEL
                value: "0"
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
