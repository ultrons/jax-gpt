# DS-v3 full config — streaming_bwd with full non-finite fix (v58).
# Extends v56: replaces NaN AND inf in all kernel outputs with 0.
# Also adds tokn/toki checks (NaN/inf in d_tok_partial) and gi (inf in g_full).
#
# Hypothesis: v56 nan_to_num(nan=0.0) left inf values in d_tok_partial/d_wo_p,
# causing inf to propagate backward through attention layers → NaN loss at step 1.
#
# Expected: loss finite at all 10 steps; loss curve should match jax baseline (v57).
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v58-full-streaming-inffix.yaml
# Logs:
#   POD=$(kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     get pods -l app=dsv3-4x8x8-v58-full-streaming-inffix --no-headers \
#     -o custom-columns=NAME:.metadata.name | head -1) && \
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs $POD 2>&1 | tee /tmp/dsv3-4x8x8-v58-full-streaming-inffix.log
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v58-full-streaming-inffix
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v58-full-streaming-inffix
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v58-full-streaming-inffix
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v74-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=streaming_bwd"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=64"
                    - "--ep=8"
                    - "--gbs=1024"
                    - "--steps=10"
                    - "--gradient_checkpoint"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep8-fsdp64-gbs1024-v58-full-streaming-inffix"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
