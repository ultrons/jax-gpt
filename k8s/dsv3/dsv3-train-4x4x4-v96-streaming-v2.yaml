# Mini DSv3 training — streaming_bwd_v2 on bodaborg 4x4x4.
#
# Validates fixed v2 kernel (full-F gather for d_tok) produces no NaN.
# Compare loss against v96-jax reference run at same config.
#
# Config: mini (L=8, D=2048, E=16), EP=4, FSDP=32, GBS=256, 10 steps
# Devices: 4x4x4 = 16 pods × 8 devices = 128 JAX devices (dp=1)
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     apply -f k8s/dsv3-train-4x4x4-v96-streaming-v2.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=dsv3-4x4x4-v96-streaming-v2 --prefix=true -f --max-log-requests=16 \
#     2>&1 | tee -a /tmp/dsv3-4x4x4-v96-streaming-v2.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset dsv3-4x4x4-v96-streaming-v2
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x4x4-v96-streaming-v2
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: lq
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 16
          parallelism: 16
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x4x4-v96-streaming-v2
              annotations:
                cloud.google.com/gke-tpu-slice-topology: "4x4x4"
                cloud.google.com/skip-tpu-webhook-check: "true"
                kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
                kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
              tolerations:
                - key: "google.com/tpu"
                  value: "present"
                  operator: "Equal"
                  effect: "NoSchedule"
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v96-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=mini"
                    - "--moe_backend=streaming_bwd_v2"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=32"
                    - "--ep=4"
                    - "--gbs=256"
                    - "--steps=10"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://max-experiments/dsv3/jax-cc/4x4x4-ep4-fsdp32-gbs256-v96-streaming-v2"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
