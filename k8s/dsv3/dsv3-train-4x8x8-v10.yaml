# DS-v3 671B on sivaibhav-exp-v7x 4x8x8.
# EP=8, FSDP=64, GBS=1024.
# Backends: moe=ring a2a (ragged_all_to_all sparse dispatch), attn=splash.
#
# Key changes vs v9 (ring ragged_dot + sparsecore flags):
# - moe_ring_dispatch=a2a: replaces all_gather with true sparse ragged_all_to_all.
#   Each device sends only its K routed tokens to each expert device (no EP× waste).
#   Forward: dispatch A2A + gather A2A (two ragged_all_to_all per MoE layer)
#   Backward: handled automatically by JAX autodiff (transpose A2A, PR #26959)
# - Expected: ~EP× (8×) less MoE communication vs ragged_dot
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v10.yaml
#
# Logs:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs -l app=dsv3-4x8x8-v10 --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v10.log
#
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v10
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v10
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v10
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v33-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=ring"
                    - "--moe_ring_dispatch=a2a"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=64"
                    - "--ep=8"
                    - "--gbs=1024"
                    - "--steps=15"
                    - "--gradient_checkpoint"
                    - "--profile"
                    - "--profile_dir=gs://sivaibhav-exp/dsv3/profiles/4x8x8-ep8-fsdp64-gbs1024-v10"
                    - "--profile_skip=5"
                    - "--profile_steps=2"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep8-fsdp64-gbs1024-v10"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                        --xla_tpu_offload_gather_to_sparsecore=true
                        --xla_tpu_enable_offloading_scatter_to_sparsecore=true
                        --xla_tpu_enable_offloading_sort_to_sparsecore=true
                  resources:
                    limits:
                      google.com/tpu: "4"
