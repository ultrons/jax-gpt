# DSv3 671B — pure JAX ragged_dot MoE, FSDP=256 TP=2 EP=1 on 4x8x8.
#
# Key change from pfwd_jbwd experiments (v228–v232):
#   v233: pivot to ragged_dot backend.  No Pallas, no ICI barriers.
#
#   Problem: Pallas ICI barrier aliasing (v228–v232) — all sync_barrier()
#   calls in the forward kernel shared the same SMEM semaphore slot.
#   Fast device K+1 signals alias into slow device K-wait → TPU watchdog.
#   No working barrier pattern found across 12 attempts.
#
#   New approach: pure JAX ragged_dot for MoE (EP=1, FSDP=256, TP=2).
#   Sort tokens by expert → jax.lax.ragged_dot → scatter-add.
#   O(T×K) flops instead of O(T×E) einsum.  No ICI, no Pallas, no SMEM.
#
#   Config: mini (full 671B dimensions, L=2) for fast compile + perf measurement.
#   FSDP=256, TP=2, EP=1 — 512 devices (4x8x8 = 256 chips × 2 TCs).
#   F_shard = D_moe/FSDP = 2048/256 = 8.
#   T_fsdp = GBS×S/FSDP = 16384×4096/256 = 262144 tokens/device.
#   Chunked 4× (SC_MAX_ROWS=65536) inside ragged_dot body.
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     -n poc-dev apply -f k8s/dsv3-train-4x8x8-v233-rd.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=v233-rd --prefix=true -f --max-log-requests=64 -n poc-dev \
#     2>&1 | tee -a /tmp/v233-rd.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset v233-rd -n poc-dev
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v233-rd
  namespace: poc-dev
  labels:
    kueue.x-k8s.io/queue-name: lq
    team: dev
    value-class: development
    declared-duration-minutes: "60"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: v233-rd
              declared-duration-minutes: "60"
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x8x8"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            priorityClassName: poc-dev-priority
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v233-rd
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=mini
              - --moe_backend=ragged_dot
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=256
              - --ep=1
              - --tp=2
              - --gbs=16384
              - --steps=5
              - --grad_clip=1.0
              - --gradient_checkpoint
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_TRACEBACK_FILTERING
                value: "off"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x8x8-ep1-fsdp256-tp2-gbs16384-v233-rd
              - name: TF_CPP_MIN_LOG_LEVEL
                value: "0"
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
