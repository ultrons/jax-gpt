# DSv3 671B — AllReduce-GMM, FSDP=256 EP=1 TP=2, GBS=1024, S=4096.
#
# Key changes from v248-rd:
#   v249: AllReduce-GMM backend (--moe_backend=gmm).
#         No weight AllGather: each FSDP device holds its F_local=8 columns
#         of every expert weight. Gate/up computed in F_local; down projection
#         AllReduces (psum) the partial D-dim output.
#         ICI per MoE layer: 1 AllReduce of ~1.8 GB vs 3 AllGathers of 7.5 GB.
#
#         FSDP=256, EP=1, TP=2 on 4x8x8 (512 devices):
#           B_l = GBS/FSDP = 1024/256 = 4 sequences per FSDP device
#           S_l = S/TP = 4096/2 = 2048 (TP shards sequence in splash attn)
#           q_t = bf16[4, 128, 2048, 192] = 0.4 GB per attn tensor
#           9 attn tensors × 4.65 = 16.7 GB < 94.75 GB compile limit ✓
#           F_local = D_moe/FSDP = 2048/256 = 8 (tiny; ragged_dot handles it)
#           MoE peak memory: ~4 GB per device (no large weight AllGather) ✓
#
#   v248: GBS=256 (fix attention-backward 1.04 TB compile OOM at GBS=4096).
#   v247: one_hot dtype positional arg → keyword dtype= (fix TypeError).
#   v246: targets in nondiff_argnums → residuals (fix UnexpectedTracerError).
#   v244: jax.checkpoint on scan → custom_vjp (fix 1.04 TB OOM).
#   v242: Python for-loop → lax.scan (fix 1.05 TB HLO unroll OOM).
#   v241: megablox_gmm no VJP → ragged_dot bwd (fix 107 GB Jacobian OOM).
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     -n poc-dev apply -f k8s/dsv3-train-4x8x8-v249-rd.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=v249-rd --prefix=true -f --max-log-requests=64 -n poc-dev \
#     2>&1 | tee -a /tmp/v249-rd.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset v249-rd -n poc-dev
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v249-rd
  namespace: poc-dev
  labels:
    kueue.x-k8s.io/queue-name: lq
    team: dev
    value-class: development
    declared-duration-minutes: "240"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: v249-rd
              declared-duration-minutes: "240"
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x8x8"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            priorityClassName: poc-dev-priority
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v249-rd
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=full
              - --moe_backend=gmm
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=256
              - --ep=1
              - --tp=2
              - --gbs=1024
              - --dtype=bfloat16
              - --steps=5
              - --grad_clip=1.0
              - --gradient_checkpoint
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_TRACEBACK_FILTERING
                value: "off"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x8x8-fsdp256-ep1-tp2-gbs1024-v249-rd
              - name: TF_CPP_MIN_LOG_LEVEL
                value: "0"
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
