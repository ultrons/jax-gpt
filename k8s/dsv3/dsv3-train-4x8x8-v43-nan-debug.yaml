# DS-v3 streaming backward NaN debug — debug config (10 MoE layers), 2 steps.
# Adds jax.debug.print at each stage inside _streaming_bwd_fn to locate NaN source.
# Step 0 backward prints should all be finite; check which tensor first shows nan=True.
#
# Expected output pattern per line (from rank-0 device only):
#   [streaming_bwd] g_full  nan=False max=X.X
#   [streaming_bwd] d_tok_partial  nan=False/True max=X.X   ← first True = NaN source
#   [streaming_bwd boundary] d_fx nan=False/True
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v43-nan-debug.yaml
# Logs:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs -l app=dsv3-4x8x8-v43-nan-debug --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v43-nan-debug.log
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v43-nan-debug
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v43-nan-debug
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v43-nan-debug
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v62-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=debug"
                    - "--moe_backend=streaming_bwd"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=64"
                    - "--ep=8"
                    - "--gbs=1024"
                    - "--steps=2"
                    - "--gradient_checkpoint"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep8-fsdp64-gbs1024-v43-nan-debug"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
