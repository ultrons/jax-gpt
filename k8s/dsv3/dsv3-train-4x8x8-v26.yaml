# DS-v3 671B: jax backend, EP=8, FSDP=64, GBS=1024, v44-train.
#
# Fix over v24: fused gate+up projection in MoE expert loop.
#   - Concatenate wi_0, wi_1 → wi_01 = (E_local, D, 2×D_moe/FSDP) outside expert loop
#   - Inside loop: one matmul sel_x_e @ wi_01[e] instead of two separate matmuls
#   - wi_01 = 32 × 7168 × 64 × 2 = 29.4 MB — fits in VMEM (80 MB limit)
#   - Each expert iteration: 2 HBM reads of sel_x_e → 1 HBM read
#
# v25 was attempted (selective checkpoint to skip attention recompute) but OOMed:
#   - Storing attention intermediates for 58 scan layers = ~34 GB extra
#   - 145 GB total vs 94.75 GB compile limit → crash
#   - Reverted to full jax.checkpoint(_moe_layer_body) (same as v24)
#
# Expected savings from fused gate+up:
#   - sel_x_e = (max_tpe, D) = (4096, 7168) × 2 bytes = 58.7 MB per expert
#   - 32 experts × 1 read saved = saves 1880 MB per MoE layer per forward pass
#   - Forward + backward remat (checkpoint reruns forward once): 2× = 3760 MB saved
#   - At HBM BW 3.6 TB/s: 3760 MB / 3600 GB/s = 1.04 ms per MoE layer
#   - 58 MoE layers × 1.04 ms = 60 ms per step pair (profile = 2 steps), ×24 scale ≈ 0.72s
#   - Expected step time: ~15.1s (from 15.8s), TPS/chip: ~1085 → ~1110
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v26.yaml
#
# Logs:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs -l app=dsv3-4x8x8-v26 --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v26.log
#
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v26
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v26
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v26
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v45-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=jax"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=64"
                    - "--ep=8"
                    - "--gbs=1024"
                    - "--steps=15"
                    - "--gradient_checkpoint"
                    - "--profile"
                    - "--profile_dir=gs://sivaibhav-exp/dsv3/profiles/4x8x8-ep8-fsdp64-gbs1024-v26"
                    - "--profile_skip=5"
                    - "--profile_steps=2"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep8-fsdp64-gbs1024-v26"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
