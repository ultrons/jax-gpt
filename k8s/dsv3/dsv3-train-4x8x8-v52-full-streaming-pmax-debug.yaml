# DS-v3 full config — streaming_bwd pmax debug (v52).
# Uses pmax aggregation inside _streaming_bwd_fn to collect global NaN/mag status,
# returned as P() scalars from shard_map. jax.debug.print fires outside shard_map
# once per host process per layer → exactly 58 SBWD lines per backward step.
#
# Each SBWD line shows global (pmax-aggregated across 512 devices):
#   g_nan/g_max    — incoming gradient (from custom_vjp residuals)
#   fx_nan         — stored token activations (key: should be False at step-0 bwd layer 57)
#   fw_nan         — stored routing weights
#   w1_nan/wo_nan  — gate/output weight shards
#   dtok_nan       — token gradient from kernel
#   dw1_nan/max    — weight gradient from kernel (was True at step-1 bwd, dw0_nan)
#
# If at layer 57 (last MoE in fwd = first in bwd):
#   g_nan=False AND fx_nan=False AND w1_nan=False AND dw1_nan=True
#   → NaN originates INSIDE fused_ep_moe_bwd_streaming kernel computation.
#   Next step: add kernel-level checks for h_g, d_h_act, d_h_g for e=0.
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v52-full-streaming-pmax-debug.yaml
# Logs (capture first pod only to minimize log volume):
#   POD=$(kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     get pods -l app=dsv3-4x8x8-v52-full-streaming-pmax-debug --no-headers \
#     -o custom-columns=NAME:.metadata.name | head -1) && \
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs $POD -f 2>&1 | tee -a /tmp/dsv3-4x8x8-v52-full-streaming-pmax-debug.log
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v52-full-streaming-pmax-debug
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v52-full-streaming-pmax-debug
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v52-full-streaming-pmax-debug
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v69-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=streaming_bwd"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=64"
                    - "--ep=8"
                    - "--gbs=1024"
                    - "--steps=2"
                    - "--gradient_checkpoint"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep8-fsdp64-gbs1024-v52-full-streaming-pmax"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
