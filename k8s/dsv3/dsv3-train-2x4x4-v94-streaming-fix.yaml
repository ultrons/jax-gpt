# DS-v3 streaming_bwd v1 NaN fix v2 — removes wrong psum(g_l,"fsdp") from backward.
#
# Root cause of v93 NaN: psum(g_l,"fsdp") at line 973 sums gradients from FSDP
# *different* token positions (since out_specs=P(("ep","fsdp"),None) assigns distinct
# global tokens to each fsdp device). At FSDP=16 this multiplies weight gradients by
# ~16×, causing divergence within 4 steps. Fix: g_l passes through as identity (the
# correct VJP of psum("fsdp") in the forward). Verified analytically vs jax.vjp.
#
# Changes vs v93:
#   - model.py:973: removed psum(g_l,"fsdp"), replaced with identity
#   - No --gradient_checkpoint (isolate checkpoint interaction)
#   - Image: v94-train
#
# Config: mini (L=8, D=2048, E=16), EP=4, FSDP=16, GBS=256
# Devices: 2x4x4 = 8 pods × 4 chips × 2 cores = 64 JAX devices
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot \
#     apply -f k8s/dsv3-train-2x4x4-v94-streaming-fix.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot \
#     logs -l app=dsv3-2x4x4-v94-streaming-fix \
#     --prefix=true -f --max-log-requests=8 \
#     2>&1 | tee -a /tmp/dsv3-2x4x4-v94-streaming-fix.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot \
#     delete jobset dsv3-2x4x4-v94-streaming-fix
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-2x4x4-v94-streaming-fix
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 8
          parallelism: 8
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-2x4x4-v94-streaming-fix
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x4x4
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v94-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=mini"
                    - "--moe_backend=streaming_bwd"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=16"
                    - "--ep=4"
                    - "--gbs=256"
                    - "--steps=10"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/2x4x4-ep4-fsdp16-gbs256-v94-streaming-fix"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
