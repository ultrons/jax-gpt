# DS-v3 671B: jax backend (custom_vjp), EP=32, FSDP=16, GBS=1024, PDBS=2.
#
# Purpose: fix v17 INT32 scan carry overflow by using _moe_jax_ep_fn custom_vjp.
#
# v17 failure root cause:
#   jax backend: autodiff through shard_map inside lax.scan creates scan carry
#   bf16[58,64,4096,7168] = (L_moe, PDBS*EP, S, D) = 218 GB → INT32 word overflow.
#   Error: INTERNAL: RET_CHECK failure: allocation_size_words <= INT32_MAX: 3,405,774,848
#
# Fix (v38-train image):
#   Added _moe_jax_ep_fn custom_vjp at module level in model.py.
#   custom_vjp breaks the scan carry: backward stores only (fx, fi, fw, w0, w1, wout)
#   residuals per layer — O(GBS/FSDP × D) instead of O(GBS × D × EP).
#   Backward uses jax.vjp on the shard_map forward (safe outside lax.scan).
#
# jax backend at EP=32 advantage:
#   sorted_x ≈ T_global × K / EP² = 4194304 × 8 / 1024 = 32,768 rows = 0.47 GiB
#   vs ring+A2A EP=8 (v10): sorted_x = 524,288 rows = 7.5 GiB
#   Scatter-add backward eliminated (sorted_x is tiny → no SparseCore sort)
#   Expected: step time drops from 35s (v10) to ~15-20s
#
# Memory check:
#   pre-sort tensor: (T_global/EP × K, D) = (1,048,576, 7168) = 15 GiB < 16 GiB ✓
#   (SparseCore 16 GiB limit: 15 GiB barely fits)
#   Total HBM: similar to v10 (sorted_x much smaller → better)
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v18.yaml
#
# Logs:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs -l app=dsv3-4x8x8-v18 --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v18.log
#
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v18
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v18
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v18
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v38-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=jax"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=16"
                    - "--ep=32"
                    - "--gbs=1024"
                    - "--steps=15"
                    - "--gradient_checkpoint"
                    - "--profile"
                    - "--profile_dir=gs://sivaibhav-exp/dsv3/profiles/4x8x8-ep32-fsdp16-gbs1024-v18"
                    - "--profile_skip=5"
                    - "--profile_steps=2"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep32-fsdp16-gbs1024-v18"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
