# Mini DSv3 training — Pallas forward (fused_ep_moe_v1) 3D mesh fix.
#
# v100: fix 3D mesh device_id — training mesh (dp=1, ep=8, fsdp=16) requires
#   3-tuple coordinates for DMA semaphores; added extra_mesh_axes=("dp",).
#
#   - Forward: Pallas A2A kernel, FSDP-sharded weights (bf=bfc=F_shard=64)
#   - Backward: streaming_bwd_v2 (same as jax backend)
#   - Routing: scoring_fn="identity", biased_scores passed from moe_routing
#
# Compare loss against v99-jax (same EP=8, FSDP=16, GBS=256) — must match.
#
# Config: mini (L=8, D=2048, E=16), EP=8, FSDP=16, GBS=256, 10 steps
# Devices: 4x4x4 = 16 pods × 8 devices = 128 JAX devices (dp=1)
# F_shard = D_moe/FSDP = 1024/16 = 64 (bf=bfc=64, 50% MXU for bf16)
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     apply -f k8s/dsv3-train-4x4x4-v101-pallas-fwd.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=dsv3-4x4x4-v101-pallas-fwd --prefix=true -f --max-log-requests=16 \
#     2>&1 | tee -a /tmp/dsv3-4x4x4-v101-pallas-fwd.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset dsv3-4x4x4-v101-pallas-fwd
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x4x4-v101-pallas-fwd
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: lq
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 16
          parallelism: 16
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x4x4-v101-pallas-fwd
              annotations:
                cloud.google.com/gke-tpu-slice-topology: "4x4x4"
                cloud.google.com/skip-tpu-webhook-check: "true"
                kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
                kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
              tolerations:
                - key: "google.com/tpu"
                  value: "present"
                  operator: "Equal"
                  effect: "NoSchedule"
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v101-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=mini"
                    - "--moe_backend=fused_ep_moe_v1"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=16"
                    - "--ep=8"
                    - "--gbs=256"
                    - "--steps=10"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://max-experiments/dsv3/jax-cc/4x4x4-ep8-fsdp16-gbs256-v101-pallas-fwd"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
