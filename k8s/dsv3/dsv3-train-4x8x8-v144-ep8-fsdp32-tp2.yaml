# DSv3 671B — jax MoE, EP=8, FSDP=32, TP=2 — P("fsdp") token sharding, ragged_dot, no token drop.
#
# Config: full (D=7168, L=61, 58 MoE layers, E=256, K=8)
# Mesh: dp=1, ep=8, fsdp=32, tp=2 → 512 JAX devices (256 chips × 2 TCs/chip)
# GBS=1024, S=4096, steps=5
# Change vs v141:
#   - Tokens sharded ONLY on FSDP (P("fsdp",None)), not EP — no EP token dispatch
#   - ragged_dot replaces per-expert sc_gather_rows loop — no max_tpe cap, no token dropping
#   - EP all-reduce (not scatter) aggregates expert contributions, preserving P("fsdp") tokens
#   - FSDP psum runs on 4×8×1 ICI in parallel with EP all-reduce on 1×1×8 ICI
#   - TP=2 splits attention heads across 2 TCs per chip (column-parallel Q/KV, D_moe split)
#   - FSDP=32 (was 64): larger per-device token count → MoE compute closer to ridge point
#   - Scan chunk_size auto-computed from activation size (was hardcoded 29)
#   Target: step time < 4s, TPS/chip > 4000
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     apply -f k8s/dsv3-train-4x8x8-v144-ep8-fsdp32-tp2.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=v144-ep8-fsdp32-tp2 --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/v144-ep8-fsdp32-tp2.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset v144-ep8-fsdp32-tp2 -n poc-dev
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v144-ep8-fsdp32-tp2
  namespace: poc-dev
  labels:
    kueue.x-k8s.io/queue-name: lq
    team: dev
    value-class: development
    declared-duration-minutes: "90"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: v144-ep8-fsdp32-tp2
              declared-duration-minutes: "90"
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x8x8"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            priorityClassName: poc-dev-priority
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v144-ep8-fsdp32-tp2
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=full
              - --moe_backend=jax
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=32
              - --ep=8
              - --tp=2
              - --gbs=1024
              - --steps=5
              - --gradient_checkpoint
              - --grad_clip=1.0
              - --profile
              - --profile_dir=gs://max-experiments/dsv3/profiles/4x8x8-ep8-fsdp32-tp2-v142
              - --profile_skip=2
              - --profile_steps=1
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x8x8-ep8-fsdp32-tp2-v142
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
