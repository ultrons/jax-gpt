# DS-v3 full config — streaming_bwd inner debug v55.
# Extends v54: adds won (d_wo_p NaN) and dtn (d_topk_partial NaN) to the print.
# v54 showed d_w1_p is NEVER NaN in step-0 bwd → gate/up weight grads are clean.
# v55 checks the remaining two kernel outputs: output-proj weight grad and routing grad.
#
# Print format inside _streaming_bwd_fn (inside shard_map, LOCAL tensors):
#   "SB e={ep} f={fsdp} gn={g_nan} fxn={fx_nan} fwn={fw_nan} dwn={dw1_nan} won={dwo_nan} dtn={dtopk_nan}"
#
# Diagnostic (step-0 backward, gn=False expected):
#   won=True  → d_wo_p NaN (output-proj weight grad) → wo weight corrupted at step-1
#   dtn=True  → d_topk_partial NaN (routing weight grad) → gate weight corrupted at step-1
#   both False → NaN source is outside MoE streaming bwd (attention, dense MLP, optimizer)
#
# Pod-0 (8 devices) sees 8 * 58 * 2 steps = 928 SB lines.
# Retrieve with: kubectl logs $POD 2>&1 | tee /tmp/v55.log
# Step-0 bwd lines: grep "SB e=0 f=0 gn=False" /tmp/v55.log | head -60
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v55-full-streaming-inner-debug2.yaml
# Logs (from COMPLETED pod):
#   POD=$(kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     get pods -l app=dsv3-4x8x8-v55-full-streaming-inner-debug2 --no-headers \
#     -o custom-columns=NAME:.metadata.name | head -1) && \
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs $POD 2>&1 | tee /tmp/dsv3-4x8x8-v55-full-streaming-inner-debug2.log
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v55-full-streaming-inner-debug2
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v55-full-streaming-inner-debug2
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v55-full-streaming-inner-debug2
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v72-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=streaming_bwd"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=64"
                    - "--ep=8"
                    - "--gbs=1024"
                    - "--steps=2"
                    - "--gradient_checkpoint"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep8-fsdp64-gbs1024-v55-full-streaming-inner2"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
