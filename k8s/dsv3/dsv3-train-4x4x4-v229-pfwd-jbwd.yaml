# DSv3 671B mini — Pallas forward + JAX backward, EP=16 FSDP=8 on 4x4x4.
#
# Key changes from v228:
#   v229: revert sync_barrier to get_barrier_semaphore() — fix collective_id error.
#
#   v225–v228 all failed with:
#     ValueError: collective_id has to be unspecified or None when not using
#     a custom barrier
#   Root cause: pallas_call config has collective_id=0 (ICI enabled). Mosaic
#   requires get_barrier_semaphore() to be called in the kernel body when
#   collective_id is set.  pl.run_scoped(REGULAR/BARRIER) alone does NOT
#   satisfy this check.
#
#   Fix: revert sync_barrier() to use get_barrier_semaphore() directly —
#   matches the working inference kernel (kernel.py) pattern.  At EP=16
#   (4x4x4, 16 devices) the inference kernel reliably handles 80 barriers
#   per pallas_call with this pattern.  The v222–v224 hang was EP=32-specific
#   (longer ICI paths in 4x4x16).
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     -n poc-dev apply -f k8s/dsv3-train-4x4x4-v229-pfwd-jbwd.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=v229-pfwd-jbwd --prefix=true -f --max-log-requests=16 -n poc-dev \
#     2>&1 | tee -a /tmp/v229-pfwd-jbwd.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset v229-pfwd-jbwd -n poc-dev
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v229-pfwd-jbwd
  namespace: poc-dev
  labels:
    kueue.x-k8s.io/queue-name: lq
    team: dev
    value-class: development
    declared-duration-minutes: "30"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 16
        parallelism: 16
        template:
          metadata:
            labels:
              app: v229-pfwd-jbwd
              declared-duration-minutes: "30"
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x4x4"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
          spec:
            priorityClassName: poc-dev-priority
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v229-pfwd-jbwd
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=mini
              - --moe_backend=pfwd_jbwd
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=8
              - --ep=16
              - --tp=1
              - --gbs=256
              - --steps=3
              - --grad_clip=1.0
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_TRACEBACK_FILTERING
                value: "off"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x4x4-ep16-fsdp8-tp1-v229-pfwd-jbwd
              - name: TF_CPP_MIN_LOG_LEVEL
                value: "0"
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
              resources:
                limits:
                  google.com/tpu: "4"
