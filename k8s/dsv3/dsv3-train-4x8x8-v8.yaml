# DS-v3 671B on sivaibhav-exp-v7x 4x8x8.
# EP=8, FSDP=64, GBS=1024.
# Backends: moe=ring ragged_dot (sparse), attn=splash.
#
# Key changes vs v7 (ring all_gather, dense einsum):
# - moe_ring_dispatch=ragged_dot: sparse ragged_dot after token sort
#   eliminates ~32× wasted FLOPs from dense T_all × E_local einsum
#   (only K/EP = 1 active expert per token on average is computed)
# - same communication: all_gather tokens 8-way, reduce_scatter back
# - same act_spec P(("ep","fsdp"), None): 2 seqs/device
#
# Submit:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     apply -f k8s/dsv3-train-4x8x8-v8.yaml
#
# Logs:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     logs -l app=dsv3-4x8x8-v8 --prefix=true -f --max-log-requests=64 \
#     2>&1 | tee -a /tmp/dsv3-4x8x8-v8.log
#
# Delete:
#   kubectl --context gke_tpu-vm-gke-testing_us-central1_sivaibhav-exp-v7x \
#     delete jobset dsv3-4x8x8-v8
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv3-4x8x8-v8
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 64
          parallelism: 64
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: dsv3-4x8x8-v8
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-flex-start: "true"
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
              containers:
                - name: trainer
                  image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v29-train
                  imagePullPolicy: Always
                  command: ["python", "train.py"]
                  args:
                    - "--config=full"
                    - "--moe_backend=ring"
                    - "--moe_ring_dispatch=ragged_dot"
                    - "--attn_backend=splash"
                    - "--optimizer=sgd"
                    - "--fsdp=64"
                    - "--ep=8"
                    - "--gbs=1024"
                    - "--steps=15"
                    - "--gradient_checkpoint"
                    - "--profile"
                    - "--profile_dir=gs://sivaibhav-exp/dsv3/profiles/4x8x8-ep8-fsdp64-gbs1024-v8"
                    - "--profile_skip=5"
                    - "--profile_steps=2"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JAX_COMPILATION_CACHE_DIR
                      value: "gs://sivaibhav-exp/dsv3/jax-cc/4x8x8-ep8-fsdp64-gbs1024-v8"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                        --xla_tpu_enable_async_collective_fusion_fuse_all_gather=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_enable_async_all_gather=true
                        --xla_enable_async_all_reduce=true
                        --xla_tpu_enable_data_parallel_all_reduce_opt=true
                        --xla_tpu_enable_ag_backward_pipelining=true
                        --xla_tpu_scoped_vmem_limit_kib=81920
                  resources:
                    limits:
                      google.com/tpu: "4"
