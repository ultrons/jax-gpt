# DSv3 671B — v274: SparseCore AllGather offload (MaxText pattern).
#
# Route AllGather through SparseCore DMA instead of TensorCore.
# Bypasses Megacore (2,1) strided layout issue entirely.
# Matches MaxText's ENABLE_SPARSECORE_OFFLOADING_FOR_ALL_GATHER flags.
#
# Submit:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     -n poc-dev apply -f k8s/dsv3-train-4x8x8-v274-sc.yaml
# Logs:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     logs -l app=v274-sc --prefix=true -f --max-log-requests=64 -n poc-dev \
#     2>&1 | tee -a /tmp/v274-sc.log
# Delete:
#   kubectl --context gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-alpha-cluster \
#     delete jobset v274-sc -n poc-dev
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v274-sc
  namespace: poc-dev
  labels:
    kueue.x-k8s.io/queue-name: lq
    team: dev
    value-class: development
    declared-duration-minutes: "240"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 64
        parallelism: 64
        template:
          metadata:
            labels:
              app: v274-sc
              declared-duration-minutes: "240"
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x8x8"
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
          spec:
            priorityClassName: poc-dev-priority
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: "google.com/tpu"
              value: "present"
              operator: "Equal"
              effect: "NoSchedule"
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/mini-dsv3:v273-maxflags
              imagePullPolicy: Always
              command: ["python", "train.py"]
              args:
              - --config=full
              - --moe_backend=gmm
              - --attn_backend=splash
              - --optimizer=sgd
              - --fsdp=256
              - --ep=1
              - --tp=2
              - --gbs=2048
              - --dtype=bfloat16
              - --steps=5
              - --grad_clip=1.0
              - --gradient_checkpoint
              - --profile
              - --profile_dir=gs://max-experiments/dsv3/profiles/v274-sc-fsdp256-tp2-gbs2048/
              - --profile_skip=2
              - --profile_steps=1
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_TRACEBACK_FILTERING
                value: "off"
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://max-experiments/dsv3/jax-cc/4x8x8-fsdp256-ep1-tp2-gbs2048-v274-sc
              - name: TF_CPP_MIN_LOG_LEVEL
                value: "0"
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
                  --xla_enable_async_all_reduce=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_scoped_vmem_limit_kib=81920
                  --xla_tpu_enable_all_experimental_scheduler_features=true
                  --xla_tpu_use_minor_sharding_for_major_trivial_input=true
                  --xla_tpu_relayout_group_size_threshold_for_reduce_scatter=1
                  --xla_tpu_assign_all_reduce_scatter_layout=true
                  --xla_tpu_megacore_fusion_allow_ags=false
                  --xla_tpu_enable_async_collective_fusion_fuse_all_gather=false
                  --xla_tpu_enable_sparse_core_collective_offload_all_gather=true
                  --xla_tpu_enable_all_gather_offload_tracing=true
                  --xla_tpu_use_tc_device_shape_on_sc=true
                  --xla_sc_enable_instruction_fusion=false
                  --xla_sc_disjoint_spmem=false
                  --xla_sc_disable_megacore_partitioning=true
              resources:
                limits:
                  google.com/tpu: "4"
