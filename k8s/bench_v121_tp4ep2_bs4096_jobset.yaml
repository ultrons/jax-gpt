# Full model: TP=4 (torus) + EP=2 (intra-chip cores), correct column/row-parallel.
#
# Mesh: (dp=8, tp=4, ep=2) = 64 TCs = 32 chips.
# Expert weights: E-dim on 'ep' (2-way fast), I-dim on 'tp' (4-way torus).
#   gate/up: P(ep, None, tp) = (256, 4096, 256) per device  — column-parallel
#   down:    P(ep, tp, None) = (256, 256, 4096) per device  — row-parallel
# MoE compute: tp allreduce after down_proj, then ep psum for routing.
# DeltaNet/GQA: 4-way tp allreduce (vs 8-way in TP=8 baseline).
# Memory: 256 experts × 4096 × 256 × 3 mats × 60 layers × 1B ≈ 48 GB ✓
#
# Baseline: TP=8/DP=8/BS=4096 → 728 TPS/chip (v113)
# This run: TP=4/EP=2/DP=8/BS=4096 → correct ep+tp sharding (v121)
#
# Profile: gs://sivaibhav-exp/qwen-profiles/v121-tp4ep2-bs4096-decode
#
# Deploy:
#   kubectl apply -f k8s/bench_v121_tp4ep2_bs4096_jobset.yaml \
#     --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot
#
# Monitor:
#   kubectl logs -l app=qwen35-v121-tp4ep2-bs4096 --prefix=true -f \
#     --max-log-requests=8 \
#     --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot \
#     2>&1 | tee -a /tmp/qwen35-v121-tp4ep2-bs4096.log

---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: qwen35-v121-tp4ep2-bs4096
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 1
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 8
          parallelism: 8
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: qwen35-v121-tp4ep2-bs4096
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x4x4
              containers:
                - name: bench
                  image: gcr.io/tpu-vm-gke-testing/jax-gpt-tpu:v121
                  imagePullPolicy: Always
                  command: ["python", "scripts/qwen35_benchmark.py"]
                  args:
                    - "--config=full"
                    - "--dtype=fp8"
                    - "--sharding=TP4EP2"
                    - "--batch-size=4096"
                    - "--prompt-len=1024"
                    - "--decode-steps=32"
                    - "--dp=8"
                    - "--ep=2"
                    - "--n-runs=3"
                    - "--use-rpa"
                    - "--scan-mode=unrolled"
                    - "--moe-backend=gmm"
                    - "--skip-prefill"
                    - "--decode-micro-batches=2"
                    - "--profile"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: PROFILE_DIR
                      value: "gs://sivaibhav-exp/qwen-profiles/v121-tp4ep2-bs4096-decode"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_offload_gather_to_sparsecore=true
                        --xla_tpu_enable_offloading_scatter_to_sparsecore=true
                        --xla_tpu_enable_offloading_sort_to_sparsecore=true
                        --xla_tpu_enable_latency_hiding_layer_scheduler=true
                        --xla_tpu_enable_multi_compute_overlap_in_layer_scheduler=true
                        --xla_tpu_enable_layer_scheduler_for_dependent_collectives=true
                        --xla_tpu_scheduler_percent_shared_memory_limit=150
                        --xla_tpu_prefer_async_allgather_to_allreduce=true
                        --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true
                        --xla_tpu_quantized_all_reduce_level=3
                        --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true
                        --xla_tpu_enable_sparse_core_reduce_scatter_v2=true
                        --xla_tpu_sparse_core_reduce_scatter_latency_multiplier=3
                        --xla_tpu_enable_sparse_core_collective_offload_all_gather=true
                        --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true
                        --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true
                        --xla_enable_async_all_gather=true
                        --xla_tpu_enable_concurrent_sparse_core_offloading=true
                        --xla_tpu_pcie_bandwidth_multiplier=0.03
                        --xla_tpu_aggressive_opt_barrier_removal=true
                        --xla_tpu_enable_sparse_core_collective_aggregator=true
                  resources:
                    limits:
                      google.com/tpu: "4"
