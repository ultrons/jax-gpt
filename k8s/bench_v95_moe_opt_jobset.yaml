# v95: one_hot routing + gather combine + fused gate+up GMM
#
# Changes vs v93 (einsum deltanet, 2-page, 573.3 TPS/chip):
#   - one_hot+sum for group_sizes (both sort paths)
#   - gather-based combine: inv_perm+reshape+sum vs scatter-add
#   - fused gate+up: 2 GMM calls per MoE layer instead of 3
#
# Baseline: v94 (Pallas deltanet, 2-page, 463.9 TPS/chip)
# Compare:  v93 (einsum deltanet, 2-page, 573.3 TPS/chip)
#
#
# Key insight from v91/v92: paged path uses donate_argnums=(2,) which updates
# cache in-place → near-zero HLO temps (v91 peak = current = 62.46 GB).
# The previous 11.79 GB OOM (v87) was from the non-paged path (no donation).
# With the fixed benchmark (v95 image), the paged path is correctly entered.
#
# With 2 micro-batches (same as v84 baseline), static ≈ 62.5 GB, fits easily.
# Expected: ~125ms step (138ms v84 baseline - 12.5ms deltanet fix = 125.5ms)
# → ~510 TPS/chip vs 463 TPS/chip baseline (10% improvement)
#
# Image: v95 = v84 + einsum deltanet + benchmark fix
# Compare against: v94 (Pallas + 2 micro-batches) to isolate deltanet effect.
# Also compare against: v84 baseline (138ms) to verify expected improvement.
#
# Deploy:
#   kubectl apply -f k8s/bench_v93_2page_einsum_jobset.yaml \
#     --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot
#
# Monitor:
#   kubectl logs -l app=qwen35-v95-moe-opt --prefix=true -f --max-log-requests=8 \
#     --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot \
#     2>&1 | tee -a /tmp/qwen35-v95-moe-opt.log

---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: qwen35-v95-moe-opt
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 1
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 8
          parallelism: 8
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: qwen35-v95-moe-opt
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x4x4
              containers:
                - name: bench
                  image: gcr.io/tpu-vm-gke-testing/jax-gpt-tpu:v95
                  imagePullPolicy: Always
                  command: ["python", "scripts/qwen35_benchmark.py"]
                  args:
                    - "--config=full"
                    - "--dtype=fp8"
                    - "--sharding=B"
                    - "--batch-size=2048"
                    - "--prompt-len=1024"
                    - "--decode-steps=32"
                    - "--dp=8"
                    - "--n-runs=3"
                    - "--use-rpa"
                    - "--scan-mode=unrolled"
                    - "--moe-backend=gmm"
                    - "--skip-prefill"
                    - "--decode-micro-batches=2"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_offload_gather_to_sparsecore=true
                        --xla_tpu_enable_offloading_scatter_to_sparsecore=true
                        --xla_tpu_enable_offloading_sort_to_sparsecore=true
                        --xla_tpu_enable_latency_hiding_layer_scheduler=true
                        --xla_tpu_enable_multi_compute_overlap_in_layer_scheduler=true
                        --xla_tpu_enable_layer_scheduler_for_dependent_collectives=true
                        --xla_tpu_scheduler_percent_shared_memory_limit=150
                        --xla_tpu_prefer_async_allgather_to_allreduce=true
                        --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true
                        --xla_tpu_quantized_all_reduce_level=3
                        --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true
                        --xla_tpu_enable_sparse_core_reduce_scatter_v2=true
                        --xla_tpu_sparse_core_reduce_scatter_latency_multiplier=3
                        --xla_tpu_enable_sparse_core_collective_offload_all_gather=true
                        --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true
                        --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true
                        --xla_enable_async_all_gather=true
                        --xla_tpu_enable_concurrent_sparse_core_offloading=true
                        --xla_tpu_pcie_bandwidth_multiplier=0.03
                        --xla_tpu_aggressive_opt_barrier_removal=true
                        --xla_tpu_enable_sparse_core_collective_aggregator=true
                  resources:
                    limits:
                      google.com/tpu: "4"
