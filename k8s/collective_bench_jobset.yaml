# Collective bandwidth/latency benchmark on v7x physical mesh
#
# Deploy:
#   kubectl create configmap collective-bench --from-file=collective_bench.py=/home/sivaibhav_google_com/ml-experiments/timing/collective_bench.py --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f k8s/collective_bench_jobset.yaml
#
# Monitor:
#   kubectl logs -l app=collective-bench --prefix=true -f --max-log-requests=8
#
# Cleanup:
#   kubectl delete jobset collective-bench
#   kubectl delete configmap collective-bench

---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: collective-bench
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 8
          parallelism: 8
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: collective-bench
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x4x4
              containers:
                - name: bench
                  image: gcr.io/tpu-vm-gke-testing/jax-gpt-tpu:v71
                  imagePullPolicy: Always
                  command: ["python", "/scripts/collective_bench.py"]
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                  volumeMounts:
                    - name: bench-script
                      mountPath: /scripts
                  resources:
                    limits:
                      google.com/tpu: "4"
              volumes:
                - name: bench-script
                  configMap:
                    name: collective-bench
