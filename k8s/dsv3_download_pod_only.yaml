apiVersion: v1
kind: Pod
metadata:
  name: dsv3-download
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: cpu-np
  containers:
    - name: download
      image: python:3.11-slim
      command: ["bash", "-c"]
      args:
        - >-
          pip install -q huggingface_hub hf_transfer &&
          df -h /mnt/model &&
          python -c "from huggingface_hub import list_repo_files; files=list(list_repo_files('deepseek-ai/DeepSeek-V3')); [print(f) for f in sorted(files)[:40]]; print('total', len(files), 'files')" &&
          HF_HUB_ENABLE_HF_TRANSFER=1 python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='deepseek-ai/DeepSeek-V3', local_dir='/mnt/model/DeepSeek-V3', local_dir_use_symlinks=False); print('Done.')" &&
          df -h /mnt/model &&
          du -sh /mnt/model/DeepSeek-V3
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: HF_TOKEN
          value: "HF_TOKEN_REMOVED"
      resources:
        requests:
          cpu: "8"
          memory: "16Gi"
        limits:
          cpu: "8"
          memory: "16Gi"
      volumeMounts:
        - name: model-weights
          mountPath: /mnt/model
  volumes:
    - name: model-weights
      persistentVolumeClaim:
        claimName: ds-v3-weights-pvc
