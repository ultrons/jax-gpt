# v69: MoE weight separation to eliminate squeeze/retiling overhead
#
# Key change: MoE expert weights are separated from the group param tree
# and reshaped (15,3,...) → (45,...) before the unrolled loop. dynamic_slice
# (same-rank 4D→4D) replaces dynamic_index_in_dim (5D→4D→3D) to avoid XLA
# slice_bitcast_fusion retiling that consumed 58% of v66 decode device time.
#
# Also uses --moe-backend=gmm (from v68).
#
# Deploy:
#   kubectl apply -f k8s/bench_v7x_nosqueeze_decode_jobset.yaml
#
# Monitor:
#   kubectl logs -l app=qwen35-nosqueeze-decode --prefix=true -f --max-log-requests=8
#
# Cleanup:
#   kubectl delete jobset qwen35-nosqueeze-decode

---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: qwen35-nosqueeze-decode
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 2
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 8
          parallelism: 8
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: qwen35-nosqueeze-decode
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x4x4
              containers:
                - name: bench
                  image: gcr.io/tpu-vm-gke-testing/jax-gpt-tpu:v69
                  imagePullPolicy: Always
                  command: ["python", "scripts/qwen35_benchmark.py"]
                  args:
                    - "--config=full"
                    - "--dtype=fp8"
                    - "--sharding=B"
                    - "--batch-size=256"
                    - "--prompt-len=1024"
                    - "--decode-steps=32"
                    - "--dp=8"
                    - "--n-runs=3"
                    - "--use-rpa"
                    - "--skip-prefill"
                    - "--scan-mode=unrolled"
                    - "--moe-backend=gmm"
                    - "--profile"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: PROFILE_DIR
                      value: "gs://sivaibhav-exp/qwen-profiles/v69-nosqueeze-decode"
                    - name: LIBTPU_INIT_ARGS
                      value: "--xla_tpu_offload_gather_to_sparsecore=true --xla_tpu_enable_offloading_scatter_to_sparsecore=true --xla_tpu_enable_offloading_sort_to_sparsecore=true"
                  resources:
                    limits:
                      google.com/tpu: "4"
