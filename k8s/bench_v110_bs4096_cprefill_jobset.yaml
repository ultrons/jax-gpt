# v110: BS=4096, chunked prefill — static page_start in DUS (fix v107 GSPMD all-gather)
#
# Changes vs v107 (write-into with dynamic page_start):
#   static_argnums=(2,) on _write_chunk_to_paged_kv + Python int page_start.
#   v107 failed: dynamic jnp.int32 page_start caused GSPMD to all-gather full
#   paged_kv (~135 GB/device), exceeding XLA's 32-bit allocation-word limit.
#   With static page_start, GSPMD determines target shard statically → no all-gather.
#   16 unique page_start values → 16 retraces, each a trivial DUS compile.
#
#   Also carries v107 fixes: get_kv_cache_shape() for correct paged_kv layout.
#
# Why v106 failed (chunk 6 OOM):
#   Binary: 13.22 GB. After 5 chunks of accumulated pages: 5×1.1 GB = 5.5 GB used.
#   Free at chunk 6: 18.76 - 5.5 = 13.07 GB < 13.22 GB needed. Failed to reload binary.
#
# v110 HBM profile (expected):
#   paged_kv: pre-allocated full-size, constant throughout.
#   Chunk temp: ~1.1 GB (appears + disappears each iteration).
#   Binary: 13.22 GB (always fits in the headroom).
#
# Deploy:
#   kubectl apply -f k8s/bench_v110_bs4096_cprefill_jobset.yaml \
#     --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot
#
# Monitor:
#   kubectl logs -l app=qwen35-v110-bs4096-cprefill --prefix=true -f --max-log-requests=8 \
#     --context gke_cloud-tpu-multipod-dev_us-central1_ninja-v7x-64-spot \
#     2>&1 | tee -a /tmp/qwen35-v110-bs4096-cprefill.log

---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: qwen35-v110-bs4096-cprefill
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 1
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          completions: 8
          parallelism: 8
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: qwen35-v110-bs4096-cprefill
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x4x4
              containers:
                - name: bench
                  image: gcr.io/tpu-vm-gke-testing/jax-gpt-tpu:v110
                  imagePullPolicy: Always
                  command: ["python", "scripts/qwen35_benchmark.py"]
                  args:
                    - "--config=full"
                    - "--dtype=fp8"
                    - "--sharding=B"
                    - "--batch-size=4096"
                    - "--prompt-len=1024"
                    - "--decode-steps=32"
                    - "--dp=8"
                    - "--n-runs=3"
                    - "--use-rpa"
                    - "--scan-mode=unrolled"
                    - "--moe-backend=gmm"
                    - "--skip-prefill"
                    - "--decode-micro-batches=2"
                    - "--prefill-micro-batches=16"
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_offload_gather_to_sparsecore=true
                        --xla_tpu_enable_offloading_scatter_to_sparsecore=true
                        --xla_tpu_enable_offloading_sort_to_sparsecore=true
                        --xla_tpu_enable_latency_hiding_layer_scheduler=true
                        --xla_tpu_enable_multi_compute_overlap_in_layer_scheduler=true
                        --xla_tpu_enable_layer_scheduler_for_dependent_collectives=true
                        --xla_tpu_scheduler_percent_shared_memory_limit=150
                        --xla_tpu_prefer_async_allgather_to_allreduce=true
                        --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true
                        --xla_tpu_quantized_all_reduce_level=3
                        --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true
                        --xla_tpu_enable_sparse_core_reduce_scatter_v2=true
                        --xla_tpu_sparse_core_reduce_scatter_latency_multiplier=3
                        --xla_tpu_enable_sparse_core_collective_offload_all_gather=true
                        --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true
                        --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true
                        --xla_enable_async_all_gather=true
                        --xla_tpu_enable_concurrent_sparse_core_offloading=true
                        --xla_tpu_pcie_bandwidth_multiplier=0.03
                        --xla_tpu_aggressive_opt_barrier_removal=true
                        --xla_tpu_enable_sparse_core_collective_aggregator=true
                  resources:
                    limits:
                      google.com/tpu: "4"
