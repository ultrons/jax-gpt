# Workload: DSv3 671B training, no-EP parallelism (FSDP+TP, no expert parallel).
#
# Sister track to dsv3_train_full.yaml. Same model/hardware/batch; only
# parallelism strategy differs. Established at the user's request after
# dsv3_train_full hit a `moe_xlayer_prefetch` bug at compile (the
# canonical FSDP_AG lever for ep=4) and the ep=4 headroom report's
# structural argument was acknowledged but the human elected to verify
# the no-EP regime empirically.
#
# History of attempts at this no-EP workload:
#   attempt 1 (`fsdp=512 ep=1 tp=1`): libtpu SC-offload CHECK fail at
#     fsdp=512-mesh geometry (see v7x_KNOWLEDGE.md §5).
#   attempt 2 (`fsdp=256 ep=1 tp=2`): compile-time HBM OOM; 256 experts
#     AGed × per-chunk transient = 4× v304's at ep=4. +32 GB over the
#     94.75 GB conservative compile-time HBM limit.
#   attempt 3 (CURRENT, `fsdp=128 ep=1 tp=4`): TP=4 splits the F dim
#     4 ways, so per-device AG transient drops to ~1.79 GiB/chunk —
#     matching v304's 1.78 GiB/chunk exactly. PDBS = gbs/fsdp = 4096/128 =
#     32, also matching v304. Per-device weight + activation footprint
#     should be near-identical to v304; the difference is TP=4 introduces
#     a TP_AR comm leaf that v304 (tp=1) doesn't have, while saving the
#     EP_AG_dispatch leaf that v304 has at ep=4.
#
# Branch name `autoperf/dsv3_train_purefsdp` is retained for continuity;
# "no-EP" describes the actual workload.
#
# Per-device economics vs v304 baseline (ep=4 fsdp=128 tp=1):
#   PDBS:       32 (matches v304)
#   Expert AG:  256 experts × F/4 = 1.79 GiB/chunk (matches v304's 1.78)
#   AG reach:   FSDP=128 (matches v304)
#   EP comm:    none (vs ep=4 token AG ~25 ms exposed)
#   TP comm:    new — TP=4 introduces TP_AR after attn/MoE (4× larger
#               than what v321's TP=2 would have)
#
# This is the cleanest possible no-EP comparison to v304 by HBM profile.
# If it compiles, iter-0 baseline TPS becomes the "no-EP at gbs=4096"
# datapoint and iter-1 picks the first leaf-driven lever from there.
# If it doesn't compile (third compile-side failure on this track),
# the empirical conclusion is even stronger: no-EP isn't viable at
# gbs=4096 on this hardware.

model: dsv3_671b
hardware: v7x_4x8x8
regime: training
parallelism:
  dp: 1
  fsdp: 128
  ep: 1
  tp: 4
batch: 4096          # global batch size (sequences)
ctx: 4096            # sequence length
prompt: 0            # not applicable for training
weight_dtype: bf16
kv_dtype: bf16

cluster_context: gke_cloud-tpu-multipod-dev_us-central1_bodaborg-super-rbq

# Bug 2/3/4 workarounds carry over from dsv3_train_full:
#   ga=1     → Bug 2 (scan+remat+vjp NaN) — locked
#   n_chunks=2 → Bug 3 (n_chunks=4 bwd NaN) — locked
#   gbs=4096   → Bug 4 (PDBS=1 NaN); at fsdp=256, gbs=4096 → PDBS=16, well above floor
cde_overrides:
  config: full
  moe_backend: gmm_ag
  attn_backend: splash
  optimizer: sgd
  fsdp: 128
  ep: 1
  tp: 4
  gbs: 4096
  grad_accum: 1
  moe_n_chunks: 2
  steps: 5
  grad_clip: 1.0
  dtype: bfloat16
  gradient_checkpoint: true
  no_cp: true
